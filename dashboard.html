<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercado Raiz</title><style>body{font:16px system-ui;margin:0;background:#f5f1e8;color:#182018}header{padding:26px 8%;background:#214e34;color:#fff}main{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;padding:18px;margin:16px 0;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;margin:7px 0}input[type=range]{width:100%}select,button{padding:9px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.good{color:#176437}.warn{color:#973b1e}.weight{font-weight:700}</style><header><h1>Mercado Raiz</h1><p>Simulador de mercados para yerba mate argentina</p></header><main><section class="card"><div class="grid"><div><label>Corrida base <select id="run"></select></label><label>Continente <select id="continent"><option value="all">Todos</option><option>Europa</option><option>América</option><option>Asia</option></select></label></div><div><b>Países a comparar</b><div id="countries"></div></div></div></section><section class="card"><h2>Prioridades del escenario</h2><div class="grid" id="sliders"></div><p id="total"></p><button id="save">Guardar escenario</button></section><section class="card"><h2>Ranking simulado</h2><p id="meta"></p><table><thead><tr><th>#</th><th>Mercado</th><th>Puntaje</th><th>Confianza</th><th>Explicación</th></tr></thead><tbody id="rows"></tbody></table></section><section class="card"><h2>Cambio frente a la corrida base</h2><div id="change">Elegí una corrida.</div></section></main><script>let runs=[],data=null;const q=s=>document.querySelector(s),continent={ESP:'Europa',DEU:'Europa',USA:'América',BRA:'América',CHL:'América',MEX:'América',URY:'América',JPN:'Asia'},dims=['demanda_y_aceptacion','acceso_comercial','capacidad_de_compra','riesgo_de_operar'],names=['Demanda y aceptación','Acceso comercial','Capacidad de compra','Riesgo de operar'];let w=[45,25,15,15];function ui(){q('#sliders').innerHTML=dims.map((d,i)=>`<label>${names[i]} <span class="weight" id="v${i}">${w[i]}%</span><input type="range" min="0" max="100" value="${w[i]}" data-i="${i}"></label>`).join('');q('#sliders').querySelectorAll('input').forEach(x=>x.oninput=e=>{w[+e.target.dataset.i]=+e.target.value;ui();draw()});q('#total').textContent='Total: '+w.reduce((a,b)=>a+b,0)+'%. El sistema normaliza automáticamente estos pesos.'}function picks(){let c=q('#continent').value;return [...q('#countries').querySelectorAll('input:checked')].map(x=>x.value).filter(x=>c==='all'||continent[x]===c)}function draw(){if(!data)return;let ids=picks(), sum=w.reduce((a,b)=>a+b,0)||1,rank=data.ranking.filter(x=>ids.includes(x.pais_iso3)).map(x=>{let score=dims.reduce((a,d,i)=>a+(x.puntajes_dimension[d]??0)*w[i]/sum,0);return {...x,scenario:score}}).sort((a,b)=>b.scenario-a.scenario);q('#meta').textContent=`${rank.length} mercados · pesos normalizados desde ${w.reduce((a,b)=>a+b,0)}%`;q('#rows').innerHTML=rank.map((x,i)=>`<tr><td>${i+1}</td><td>${x.pais} (${continent[x.pais_iso3]||'Otro'})</td><td>${x.scenario.toFixed(1)}</td><td>${Math.round(x.confianza_datos*100)}%</td><td>${(x.evidencia||[]).slice(0,2).map(a=>a.metrica).join(' · ')||'Sin evidencia'}</td></tr>`).join('');q('#change').innerHTML=rank.map((x,i)=>`<p><b>${x.pais}</b>: posición base ${x.posicion}, posición escenario ${i+1}. Cambió porque los pesos del escenario modifican la relevancia de sus dimensiones.</p>`).join('')}async function load(i){data=await fetch('corridas/'+runs[i].archivo).then(x=>x.json());q('#countries').innerHTML=data.ranking.map(x=>`<label><input type="checkbox" checked value="${x.pais_iso3}"> ${x.pais}</label>`).join('');q('#countries').querySelectorAll('input').forEach(x=>x.onchange=draw);draw()}fetch('corridas/index.json').then(x=>x.json()).then(d=>{runs=d.corridas||[];q('#run').innerHTML=runs.map((x,i)=>`<option value="${i}">${x.id}</option>`).join('');q('#run').onchange=e=>load(+e.target.value);if(runs.length)load(runs.length-1)}).catch(()=>q('#run').innerHTML='<option>Sin corridas</option>');q('#continent').onchange=draw;q('#save').onclick=()=>{let blob=new Blob([JSON.stringify({fecha:new Date().toISOString(),pesos:Object.fromEntries(dims.map((d,i)=>[d,w[i]])),paises:picks()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='escenario-mercado-raiz.json';a.click();URL.revokeObjectURL(a.href)};ui()</script></html>
